name: Bug Report
description: Report a bug or unexpected sync/safety-policy behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: A clear description of the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Minimal Swift snippet or drive-cycle scenario reproducing the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15 / iOS 18 / Swift 6.0 / CarPlay"
    validations:
      required: true
