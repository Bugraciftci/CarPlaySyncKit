name: Feature Request
description: Suggest a new capability or CarPlay policy enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What synchronization or HMI safety gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / Design
      description: Suggested Swift protocol/actor surface or behavior.
    validations:
      required: true
